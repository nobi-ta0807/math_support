<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathCards</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark;--bg:#f5f6fa;--panel:#fff;--text:#192232;--muted:#697486;--border:#dfe4ed;--accent:#465ee7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:10px}button:hover{filter:brightness(.96)}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.danger{color:#b32632}.app{max-width:1100px;margin:auto;display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:var(--panel);border-right:1px solid var(--border);padding:22px 14px}aside h1{margin:0 0 24px;font-size:23px}.nav{display:block;width:100%;text-align:left;margin:5px 0;border:0;background:transparent}.nav.active{background:#e8ebff;color:#263bb9;font-weight:700}main{padding:25px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin:15px 0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.tile{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:16px;cursor:pointer}.tile:hover{border-color:var(--accent)}.tag{font-size:12px;background:#edf0fa;border-radius:30px;padding:4px 9px;color:#3f4b66;display:inline-block;margin:4px 3px 0 0}.field{margin:15px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px;background:var(--panel);color:var(--text)}textarea{resize:vertical;min-height:90px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.editor{border:1px solid var(--border);border-radius:10px;min-height:105px;padding:12px;outline:none;line-height:1.65;overflow-wrap:anywhere}.editor:focus{border-color:var(--accent)}.toolbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}.toolbar button{padding:6px 10px}.content{line-height:1.8;overflow-wrap:anywhere}.content img{max-width:100%}.content a{color:var(--accent)}.flip{min-height:200px;display:grid;place-items:center;text-align:center;cursor:pointer;font-size:21px}.hidden{display:none}.status{font-size:13px;color:var(--muted)}.empty{text-align:center;padding:50px 12px;color:var(--muted)}.pill{display:inline-block;border:1px solid var(--border);border-radius:99px;padding:6px 10px}.wide{width:100%}@media(max-width:700px){.app{display:block}aside{position:sticky;top:0;z-index:3;padding:10px;border-right:0;border-bottom:1px solid var(--border)}aside h1{display:inline;font-size:18px;margin-right:8px}aside nav{display:inline-flex;gap:2px;vertical-align:middle}aside .nav{width:auto;padding:8px;font-size:13px;margin:0}main{padding:14px}.panel{padding:15px}.cards{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#12151d;--panel:#1d2330;--text:#edf0f7;--muted:#a0aabc;--border:#394253;--accent:#8494ff}.nav.active{background:#303c63;color:#c9d2ff}.tag{background:#303b52;color:#d1d8ee}}
</style></head><body><div class="app"><aside><h1>◈ MathCards</h1><nav><button class="nav active" data-view="home">ホーム</button><button class="nav" data-view="list">解法一覧</button><button class="nav" data-view="review">復習</button><button class="nav" data-view="folders">フォルダ</button><button class="nav" data-view="settings">設定</button></nav></aside><main id="main"></main></div><script>
const DB='mathcards-db-v1';let db,view='home',current=null,reviewIds=[],reviewIndex=0,revealed=false,saveTimer=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID();const now=()=>new Date().toISOString();function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;for(let s of ['cards','folders','reviews'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function op(store,method,arg){return new Promise((res,rej)=>{let t=db.transaction(store,method==='get'||method==='getAll'?'readonly':'readwrite'),r=t.objectStore(store)[method](...(arg===undefined?[]:[arg]));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}const all=s=>op(s,'getAll'),get=(s,id)=>op(s,'get',id),put=(s,v)=>op(s,'put',v),del=(s,id)=>op(s,'delete',id);function setView(v){view=v;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setView(b.dataset.view));function head(t,btn=''){return `<div class="top"><h2>${t}</h2>${btn}</div>`}function strip(s){let e=document.createElement('div');e.innerHTML=s||'';return e.textContent||''}function safe(s){let t=document.createElement('template');t.innerHTML=s||'';t.content.querySelectorAll('script,iframe,object,embed,style,link,form,svg,math').forEach(n=>n.remove());t.content.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{if(a.name.startsWith('on')||['style','srcdoc'].includes(a.name)||(['href','src'].includes(a.name)&&!(/^(https?:|data:image\/(png|jpeg|gif|webp);base64,|#)/i.test(a.value))))n.removeAttribute(a.name)});if(n.tagName==='A'){n.setAttribute('rel','noopener noreferrer');n.setAttribute('target','_blank')}});return t.innerHTML}function cardTile(c,folders){return `<article class="tile" data-open="${c.id}"><div class="muted" style="font-size:12px">${esc(folders.find(f=>f.id===c.folderId)?.name||'未分類')}</div><h3>${esc(c.title||'無題')}</h3><p class="muted">${esc(strip(c.front).slice(0,100))}</p>${(c.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</article>`}async function render(){let m=$('#main');if(view==='home'){let cs=await all('cards'),rs=await all('reviews');m.innerHTML=head('ホーム',`<button class="primary" id="new">＋ 新しいカード</button>`)+`<div class="panel"><h3>学習状況</h3><div class="row"><span class="pill">カード ${cs.length} 枚</span><span class="pill">復習記録 ${rs.length} 件</span></div><p class="muted">数学の解法を記録して、何度でも思い出そう。</p><button id="goReview">復習を始める →</button></div><h3>最近のカード</h3><div class="cards">${cs.sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,6).map(c=>cardTile(c,[])).join('')||'<div class="empty">まだカードがありません。最初の1枚を作ろう。</div>'}</div>`;$('#new').onclick=()=>edit();$('#goReview').onclick=()=>setView('review');bindOpen()}else if(view==='list'){let cs=await all('cards'),fs=await all('folders');m.innerHTML=head('解法一覧',`<button class="primary" id="new">＋ カード作成</button>`)+`<div class="panel row"><input id="search" placeholder="タイトル・本文・タグを検索" style="flex:2;min-width:160px;padding:10px;border:1px solid var(--border);border-radius:9px"><select id="filter" style="flex:1;min-width:110px;padding:10px"><option value="">すべてのフォルダ</option>${fs.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div><div id="results" class="cards"></div>`;let update=()=>{let q=$('#search').value.toLowerCase(),f=$('#filter').value;$('#results').innerHTML=cs.filter(c=>(!f||c.folderId===f)&&[c.title,strip(c.front),strip(c.back),strip(c.note),(c.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)).map(c=>cardTile(c,fs)).join('')||'<div class="empty">カードが見つかりません</div>';bindOpen()};$('#search').oninput=update;$('#filter').onchange=update;$('#new').onclick=()=>edit();update()}else if(view==='folders'){let fs=await all('folders');m.innerHTML=head('フォルダ管理',`<button class="primary" id="addFolder">＋ フォルダ作成</button>`)+`<div class="panel">${fs.map(f=>`<div class="row" style="margin:10px 0"><span style="flex:1">📁 ${esc(f.name)} <small class="muted">${esc(fs.find(x=>x.id===f.parentId)?.name||'ルート')}</small></span><button data-rename="${f.id}">名前変更</button><button data-remove="${f.id}" class="danger">削除</button></div>`).join('')||'<p class="muted">フォルダはまだありません。</p>'}</div>`;$('#addFolder').onclick=async()=>{let name=prompt('フォルダ名');if(!name?.trim())return;let parent=prompt('親フォルダ名（ルートなら空欄）','');let p=fs.find(f=>f.name===parent);await put('folders',{id:uid(),name:name.trim(),parentId:p?.id||null});render()};document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{let f=fs.find(x=>x.id===b.dataset.rename),name=prompt('新しい名前',f.name);if(name?.trim()){f.name=name.trim();await put('folders',f);render()}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{let id=b.dataset.remove;if(fs.some(f=>f.parentId===id)){alert('子フォルダを先に移動・削除してください');return}if(!confirm('フォルダを削除しますか？カードは未分類になります。'))return;let cs=await all('cards');for(let c of cs.filter(c=>c.folderId===id)){c.folderId=null;await put('cards',c)}await del('folders',id);render()})}else if(view==='settings'){m.innerHTML=head('設定')+`<div class="panel"><h3>バックアップ</h3><p class="muted">カード・フォルダ・復習記録をJSONに保存します。</p><div class="row"><button id="export">JSONを書き出す</button><button id="import">JSONを読み込む</button><input id="file" type="file" accept="application/json,.json" hidden></div></div><div class="panel"><h3>保存について</h3><p>このアプリのデータは現在のブラウザ内（IndexedDB）に保存されます。ブラウザのデータ消去や端末変更に備えて、定期的にJSONバックアップを作成してください。</p></div>`;$('#export').onclick=async()=>{let data={version:1,exportedAt:now(),cards:await all('cards'),folders:await all('folders'),reviews:await all('reviews')};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='MathCards-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!Array.isArray(data.cards)||!Array.isArray(data.folders)||!Array.isArray(data.reviews))throw Error('形式が正しくありません');if(!confirm('バックアップのデータを追加・同じIDは上書きします。続けますか？'))return;for(let s of ['folders','cards','reviews'])for(let item of data[s])if(item&&typeof item.id==='string')await put(s,item);alert('読み込み完了');render()}catch(e){alert('読み込みに失敗しました: '+e.message)}}}else if(view==='review'){let cs=(await all('cards')).filter(c=>strip(c.front).trim()&&strip(c.back).trim());if(!reviewIds.length)reviewIds=cs.map(c=>c.id).sort(()=>Math.random()-.5);reviewIds=reviewIds.filter(id=>cs.some(c=>c.id===id));if(reviewIndex>=reviewIds.length){m.innerHTML=head('復習')+`<div class="panel empty">今回の復習は終了！<p><button id="restart">もう一度</button></p></div>`;$('#restart').onclick=()=>{reviewIds=[];reviewIndex=0;render()};return}let c=cs.find(c=>c.id===reviewIds[reviewIndex]);if(!c){m.innerHTML=head('復習')+'<div class="empty">復習できるカードがありません。表面と裏面を登録してね。</div>';return}m.innerHTML=head('復習')+`<p class="muted">${reviewIndex+1} / ${reviewIds.length}</p><div class="panel flip" id="flip"><div><small class="muted">${revealed?'裏面':'表面'}（タップで反転）</small><div class="content">${safe(revealed?c.back:c.front)}</div></div></div>${revealed?`<div class="row"><button data-rate="forgot">忘れた</button><button data-rate="hard">あやふや</button><button class="primary" data-rate="good">覚えた</button></div><p><button id="details">詳細ノートを見る</button></p>`:''}`;$('#flip').onclick=()=>{revealed=!revealed;render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=async()=>{await put('reviews',{id:uid(),cardId:c.id,rating:b.dataset.rate,at:now()});reviewIndex++;revealed=false;render()});if($('#details'))$('#details').onclick=()=>showCard(c.id)}}}
function bindOpen(){document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>showCard(e.dataset.open))}async function showCard(id){let c=await get('cards',id);if(!c)return setView('list');current=id;view='detail';document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'));$('#main').innerHTML=head(esc(c.title),`<button id="edit">編集</button>`)+`<div class="panel"><small class="muted">表面</small><div class="content">${safe(c.front)}</div></div><div class="panel"><small class="muted">裏面</small><div class="content">${safe(c.back)}</div></div><div class="panel"><h3>詳細ノート</h3><div class="content">${safe(c.note)}</div></div><div class="row">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="row" style="margin-top:20px"><button id="duplicate">複製</button><button id="remove" class="danger">削除</button><button id="back">一覧に戻る</button></div>`;$('#edit').onclick=()=>edit(id);$('#duplicate').onclick=async()=>{let n={...c,id:uid(),title:c.title+'（コピー）',created:now(),updated:now()};await put('cards',n);showCard(n.id)};$('#remove').onclick=async()=>{if(confirm('このカードを削除しますか？')){await del('cards',id);setView('list')}};$('#back').onclick=()=>setView('list')}
let draft;async function edit(id){draft=id?await get('cards',id):{id:uid(),title:'',front:'',back:'',note:'',folderId:null,tags:[],created:now(),updated:now()};view='edit';let fs=await all('folders');$('#main').innerHTML=head(id?'カードを編集':'カードを作成',`<span class="status" id="status">${id?'保存済み':'未保存'}</span>`)+`<div class="panel"><div class="field"><label>タイトル</label><input id="title" placeholder="例：同じものを含む順列" value="${esc(draft.title)}"></div>${[['front','表面（問い）'],['back','裏面（解法の要点）'],['note','詳細ノート']].map(([k,l])=>`<div class="field"><label>${l}</label><div class="toolbar"><button data-cmd="bold" data-for="${k}" title="太字"><b>B</b></button><button data-cmd="italic" data-for="${k}" title="斜体"><i>I</i></button><button data-cmd="insertUnorderedList" data-for="${k}">• リスト</button><button data-math="${k}">∑ 数式</button><button data-link="${k}">🔗 リンク</button></div><div class="editor" contenteditable="true" id="${k}" aria-label="${l}">${safe(draft[k])}</div></div>`).join('')}<div class="field"><label>フォルダ</label><select id="folder"><option value="">未分類</option>${fs.map(f=>`<option value="${f.id}" ${draft.folderId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label>タグ（カンマ区切り）</label><input id="tags" value="${esc((draft.tags||[]).join(', '))}" placeholder="例：順列, 場合分け"></div><div class="row"><button class="primary" id="save">保存して閲覧</button><button id="cancel">戻る</button><button id="undo">↶ 元に戻す</button><button id="redo">↷ やり直す</button></div></div>`;let capture=()=>{draft.title=$('#title').value;for(let k of ['front','back','note'])draft[k]=safe($('#'+k).innerHTML);draft.folderId=$('#folder').value||null;draft.tags=$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean);draft.updated=now()};let autosave=()=>{capture();$('#status').textContent='未保存';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await put('cards',draft);$('#status')&&($('#status').textContent='保存済み')}catch(e){$('#status')&&($('#status').textContent='保存エラー')}},800)};document.querySelectorAll('#main input,#main select,.editor').forEach(e=>e.addEventListener('input',autosave));$('#folder').onchange=autosave;$('#save').onclick=async()=>{clearTimeout(saveTimer);capture();await put('cards',draft);showCard(draft.id)};$('#cancel').onclick=async()=>{clearTimeout(saveTimer);capture();await put('cards',draft);setView('list')};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{let e=$('#'+b.dataset.for);e.focus();document.execCommand(b.dataset.cmd,false,null);autosave()});document.querySelectorAll('[data-math]').forEach(b=>b.onclick=()=>{let latex=prompt('数式を入力（LaTeX。現在は文字列として挿入）',String.raw`\frac{a}{b}`);if(latex===null)return;let e=$('#'+b.dataset.math);e.focus();document.execCommand('insertText',false,'\\('+latex+'\\)');autosave()});document.querySelectorAll('[data-link]').forEach(b=>b.onclick=async()=>{let cs=await all('cards');let names=cs.filter(c=>c.id!==draft.id).map(c=>c.title).join(' / ');let name=prompt('リンク先カードのタイトルを入力\n候補: '+names);let c=cs.find(c=>c.title===name);if(!c){if(name)alert('カードが見つかりません');return}let e=$('#'+b.dataset.link);e.focus();document.execCommand('insertHTML',false,`<a href="#card-${c.id}">${esc(c.title)}</a>`);autosave()});$('#undo').onclick=()=>{document.execCommand('undo');autosave()};$('#redo').onclick=()=>{document.execCommand('redo');autosave()}}
document.addEventListener('click',e=>{let a=e.target.closest('a[href^="#card-"]');if(a){e.preventDefault();showCard(a.getAttribute('href').slice(6))}});window.addEventListener('pagehide',()=>{if(view==='edit'&&draft){draft.title=$('#title')?.value||draft.title;for(let k of ['front','back','note'])draft[k]=safe($('#'+k)?.innerHTML||'');put('cards',draft).catch(()=>{})}});openDB().then(d=>{db=d;render()}).catch(e=>{$('#main').innerHTML='<div class="panel">データベースを開けませんでした。ブラウザのプライベートモードや保存設定を確認してください。</div>';console.error(e)});
</script></body></html>
